<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <h1>Learning Vue 3</h1>
    <div id="app">
        <div v-if="showBooks">
        <p>{{title}}</p>
        <p>Author name is {{author}}</p>
        <p>Author age is {{age}}</p>
        </div>
        <button @click="showBooks=!showBooks">
            <span v-if="showBooks">Hide</span>
            <span v-if="!showBooks">Show</span>
        </button>
        
    </div>
    <script src="app1.js"></script>
</body>
</html>
